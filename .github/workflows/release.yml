name: Release

# Run only when a version tag is pushed (e.g. v1.0.0, v1.2.0-beta).
# This workflow is intended for official releases, not every commit.
on:
  push:
    tags:
      - "v*"

jobs:
  # ============================================================
  # Build and verify the distribution on every supported platform.
  #
  # Since TesseractCLI is a local application, the most important
  # validation is ensuring that users can install the generated
  # package and execute the CLI successfully on Linux, macOS,
  # and Windows.
  # ============================================================
  build-and-verify:
    name: Build & smoke test (${{ matrix.os }})

    strategy:
      # Continue testing the remaining platforms even if one fails
      # to expose all platform-specific issues in a single run.
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Use Bash consistently across all platforms so wildcard
        # expansion (e.g. dist/*.whl) behaves identically.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.11"

      - name: Build wheel and source distribution
        run: uv build

      # Install the freshly built wheel into an isolated environment
      # to verify that packaging metadata and dependencies are correct.
      - name: Install built package
        run: |
          uv venv smoke-test-env
          source smoke-test-env/bin/activate 2>/dev/null || source smoke-test-env/Scripts/activate
          uv pip install dist/*.whl

      # Verify that the published console entry point works.
      # This catches packaging mistakes that unit tests may miss.
      - name: Smoke test CLI
        run: |
          source smoke-test-env/bin/activate 2>/dev/null || source smoke-test-env/Scripts/activate
          tesseract --help

      # Pure-Python wheels are identical across platforms, so upload
      # the artifacts only once from the Ubuntu build.
      - name: Upload build artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================================
  # Publish a GitHub Release and attach the generated artifacts.
  #
  # This allows users to download the wheel or source archive
  # directly without using PyPI.
  # ============================================================
  publish-github-release:
    name: Publish GitHub Release

    needs: build-and-verify
    runs-on: ubuntu-latest

    permissions:
      # Required to create releases and upload release assets.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ============================================================
  # Optional: Publish to PyPI.
  #
  # Enable this job if you want users to install the package via:
  #
  #     pip install tesseractcli
  #
  # instead of downloading assets from GitHub Releases.
  #
  # Trusted Publishing is recommended because it eliminates the
  # need to store a PyPI API token as a GitHub secret.
  # ============================================================
  # publish-pypi:
  #   name: Publish to PyPI
  #   needs: build-and-verify
  #   runs-on: ubuntu-latest
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - name: Download build artifacts
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: dist
  #         path: dist/
  #
  #     - name: Publish package
  #       uses: pypa/gh-action-pypi-publish@release/v1
