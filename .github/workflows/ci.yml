name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If a new commit is pushed to the same PR while a workflow is still running,
# cancel the previous run to avoid wasting CI time and GitHub Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The project targets Python 3.11 only (see pyproject.toml: >=3.11,<3.12)
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # Job 1: Lint
  #
  # Fast quality gate. Fail immediately if the code has style,
  # formatting, or syntax issues before spending time on the
  # slower type checking and test matrix.
  # ============================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run Ruff lint checks
        run: uv run ruff check .

      - name: Verify formatting
        run: uv run ruff format --check .

  # ============================================================
  # Job 2: Type Checking
  #
  # Kept separate from lint because it serves a different purpose.
  # Lint verifies code quality/style, while mypy validates static
  # type correctness.
  # ============================================================
  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run mypy
        run: uv run mypy tesseractcli

  # ============================================================
  # Job 3: Tests
  #
  # Execute the full test suite across multiple operating systems.
  # This is especially important because filesystem behavior,
  # path handling, process execution, and shell semantics differ
  # between Linux, macOS, and Windows.
  # ============================================================
  test:
    name: Test (${{ matrix.os }})
    needs: [lint, type-check]

    strategy:
      # Continue running the remaining platforms even if one fails,
      # so all platform-specific issues are visible in a single run.
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      # Tests expect a local .env file. Use the example configuration
      # so CI has a predictable environment.
      - name: Create test environment
        run: cp .env.example .env

      - name: Run test suite
        run: uv run pytest -v --tb=short

      # Optional:
      # If sandbox-related tests become large enough, consider running
      # them in a dedicated step so failures are easier to identify.
      #
      # uv run pytest tests/tools -v
