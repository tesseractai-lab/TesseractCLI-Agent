name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# لو حصل push جديد على نفس الـ PR وهو لسه شغال، بيلغي الـ run القديم
# بدل ما يفضل شغال في الفاضي ويستهلك minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11" # pyproject.toml مقفول على 3.11 بس (>=3.11,<3.12)

jobs:
  # ============================================================
  # Job 1: Lint — بيفشل بسرعة لو الكود فيه مشاكل style/syntax
  # قبل ما نضيع وقت في الـ test matrix البطيء
  # ============================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: ruff check (lint rules)
        run: uv run ruff check .

      - name: ruff format --check (style only, no auto-fix)
        run: uv run ruff format --check .

  # ============================================================
  # Job 2: Type-check — منفصل عن lint لأنه بياخد وقت مختلف ومسؤوليته
  # مختلفة (type correctness مش style)
  # ============================================================
  type-check:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: mypy
        run: uv run mypy tesseractcli

  # ============================================================
  # Job 3: Test — الجزء الأهم. Matrix على 3 أنظمة تشغيل مختلفة
  # لأن tools/sandbox/ بيتعامل مع filesystem paths وcommand execution
  # واللي بيختلف فعليًا بين Linux/macOS/Windows (مش مجرد اختلاف شكلي)
  # ============================================================
  test:
    name: Test (${{ matrix.os }})
    needs: [lint, type-check] # ما ينفعش نضيع وقت الـ matrix لو الكود أصلاً معطوب
    strategy:
      fail-fast: false # لو فشل نظام واحد، سيب الباقي يكمل عشان تشوف الصورة كاملة
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run test suite
        run: uv run pytest -v --tb=short

      # ملاحظة: لو حبيت تفصل sandbox tests في step لوحده عشان توضح
      # فشلها بشكل منفصل عن باقي التيست سويت، استخدم:
      # uv run pytest tests/tools -v
      # لكن سيبتها في step واحد هنا عشان مفيش داعي لتعقيد إضافي دلوقتي
