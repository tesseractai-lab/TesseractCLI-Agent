name: Security

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    # Run every Monday at 06:00 UTC.
    # This catches newly disclosed vulnerabilities in existing
    # dependencies even when no new code has been committed.
    - cron: "0 6 * * 1"

jobs:
  # ============================================================
  # Static Analysis
  #
  # Scan the codebase for potentially dangerous coding patterns
  # such as unsafe subprocess usage, shell injection, eval/exec,
  # insecure temporary files, and other common security issues.
  #
  # The sandbox and command execution modules receive stricter
  # enforcement because they represent the highest-risk attack
  # surface of the project.
  # ============================================================
  static-analysis:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # uvx runs Bandit in an isolated environment without requiring
      # it to be added as a project dependency.
      - name: Scan entire package (informational)
        run: uvx bandit -r tesseractcli -f screen
        continue-on-error: true

      # Treat security findings inside the sandbox and command
      # execution modules as release blockers.
      - name: Scan critical modules
        run: |
          uvx bandit -r \
            tesseractcli/tools/sandbox \
            tesseractcli/tools/exec_tool.py \
            -ll

  # ============================================================
  # Dependency Audit
  #
  # Check every resolved dependency against known vulnerability
  # databases (CVE/GHSA) to ensure no insecure package versions
  # are included in the project.
  # ============================================================
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.11"

      - name: Sync dependencies
        run: uv sync --group dev

      # Convert the resolved dependency graph into a standard
      # requirements.txt file that pip-audit can analyze.
      - name: Export resolved dependencies
        run: uv export --no-hashes --format requirements-txt -o requirements-audit.txt

      - name: Run dependency audit
        run: uvx pip-audit -r requirements-audit.txt
