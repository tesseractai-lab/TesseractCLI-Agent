[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseractcli"
version = "1.0.0"
description = "TesseractCLI-Agent — a terminal-native, multi-provider coding agent."
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- TUI ---
    "textual>=1.0.0",
    "rich>=13.7.0",

    # --- config / env / logging ---
    "pyyaml>=6.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "loguru>=0.7.3",

    # --- agent core ---
    "langchain-core>=1.5.0",

    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.0",
    # "langchain-cerebras>=0.8.2",
    # "langchain-mistralai>=1.1.6",
    "langchain-anthropic>=1.5.0",
    "langchain-cohere>=0.6.0",
    "langchain-together>=0.4.0",
    ]

[project.optional-dependencies]
# Providers NOT used by any default routing entry — only needed if you
# point a pack at one of these yourself.
# anthropic = ["langchain-anthropic>=1.5.0"]
cerebras = ["langchain-cerebras>=0.8.2"]
mistralai= ["langchain-mistralai>=1.1.6"]
# together = ["langchain-together>=0.4.0"]
# cohere   = ["langchain-cohere>=0.6.0"]
huggingface = ["langchain-huggingface>=1.2.2"]
local =       ["langchain-community>=0.4.2", "llama-cpp-python>=0.3.34"]
all-providers = [
    "tesseractcli[anthropic,together,cohere,huggingface,local]",
]

[project.scripts]
tesseract = "tesseractcli.__main__:main"

[tool.setuptools.packages.find]
include = ["tesseractcli*"]


[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]
