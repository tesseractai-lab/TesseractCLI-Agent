[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseractcli"
version = "0.0.1"
description = "TesseractCLI-Agent — a terminal-native, multi-provider coding agent."
requires-python = "==3.11.15"
dependencies = [
    "textual",
    # "anthropic",
    # "openai",
    # "groq",
    "pyyaml",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "dotenv>=0.9.9",
    "loguru>=0.7.3",
    "langchain-core>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.3.5",
    "langchain-anthropic>=1.4.8",
    "langchain-together>=0.4.0",
]

[project.scripts]
tesseract = "tesseractcli.__main__:main"

[tool.setuptools.packages.find]
include = ["tesseractcli*"]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]
