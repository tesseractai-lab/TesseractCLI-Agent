[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tesseractcli"
version = "0.0.1"
description = "TesseractCLI-Agent — a terminal-native, multi-provider coding agent."
requires-python = "==3.11.15"
dependencies = [
    "textual",
    # "anthropic",
    # "openai",
    # "groq",
    "pyyaml",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
tesseract = "tesseractcli.__main__:main"

[tool.setuptools.packages.find]
include = ["tesseractcli*"]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
